<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockGuard — แบบฝึกฝนเทียบเคียง PISA 2025 LDW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Robust multi-CDN loader for Chart.js. Some school/office networks block
     individual CDNs (e.g. cdnjs.cloudflare.com); this tries several sources
     in turn so a single blocked host doesn't take down every graph. */
  window.__chartJsLoad = new Promise(function (resolve) {
    var sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js",
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js",
      "https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js"
    ];
    var i = 0;
    function tryNext() {
      if (typeof window.Chart !== "undefined") { resolve(true); return; }
      if (i >= sources.length) { resolve(false); return; }
      var url = sources[i++];
      var s = document.createElement("script");
      s.src = url;
      s.onload = function () { resolve(typeof window.Chart !== "undefined"); };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  });
</script>
<style>
  :root{
    --bg:#0A0F1C;
    --bg-grid: rgba(108,140,255,0.045);
    --panel:#111A2C;
    --panel-2:#0D1524;
    --border:#243051;
    --border-soft:#1A2440;
    --text:#E7ECF6;
    --muted:#8C9AC0;
    --dim:#5B6889;
    --verify:#2FD98A;
    --verify-bg:rgba(47,217,138,0.12);
    --alert:#F5A93B;
    --alert-bg:rgba(245,169,59,0.12);
    --mismatch:#E4576B;
    --mismatch-bg:rgba(228,87,107,0.12);
    --primary:#6C8CFF;
    --primary-bg:rgba(108,140,255,0.12);
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(108,140,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(47,217,138,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai', sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:840px; margin:0 auto;}

  /* ---------- Top identity bar ---------- */
  .idbar{
    display:none;
    justify-content:space-between;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:18px;
    font-size:14px;
  }
  .idbar.show{display:flex;}
  .idbar .who{color:var(--text); font-weight:600;}
  .idbar .grade{color:var(--muted);}
  .idbar .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--primary);
    background:var(--primary-bg);
    border:1px solid rgba(108,140,255,0.35);
    padding:3px 9px;
    border-radius:100px;
  }

  /* ---------- Chain progress ---------- */
  .chainbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
    padding:0 4px;
  }
  .chainbar.show{display:flex;}
  .chain-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .chain-node .dot{
    width:38px; height:38px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:700;
    background:var(--panel-2);
    border:1.5px solid var(--border);
    color:var(--dim);
    transition:all .25s ease;
  }
  .chain-node .lbl{font-size:11px; color:var(--dim); letter-spacing:.02em;}
  .chain-node.active .dot{border-color:var(--primary); color:var(--primary); background:var(--primary-bg); box-shadow:0 0 0 4px rgba(108,140,255,0.10);}
  .chain-node.active .lbl{color:var(--text); font-weight:600;}
  .chain-node.done .dot{border-color:var(--verify); color:var(--verify); background:var(--verify-bg);}
  .chain-node.done .lbl{color:var(--muted);}
  .chain-link{
    flex:1 1 auto;
    height:1px;
    background:linear-gradient(90deg, var(--border-soft), var(--border-soft));
    margin:0 6px;
    position:relative;
    top:-10px;
  }
  .chain-link .hx{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; color:var(--dim);
    background:var(--bg);
    padding:0 4px;
    white-space:nowrap;
  }

  /* ---------- Cards / panels ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:16px;
  }
  .card.tight{padding:18px;}
  .eyebrow-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--primary);
    background:var(--primary-bg);
    border:1px solid rgba(108,140,255,0.3);
    padding:4px 10px;
    border-radius:100px;
    margin-bottom:14px;
  }
  h1{font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;}
  h2{font-size:20px; font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
  h3{font-size:16px; font-weight:600; margin:0 0 8px;}
  p{color:var(--muted); margin:0 0 12px;}
  .lead{color:var(--text); font-size:15px;}

  /* ---------- Intro screen ---------- */
  .hero-chain{
    display:flex; align-items:center; gap:4px; margin-bottom:22px; flex-wrap:wrap;
  }
  .hero-block{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    border:1px solid var(--border); border-radius:6px;
    padding:8px 12px; color:var(--muted); background:var(--panel-2);
  }
  .hero-block b{color:var(--text);}
  .hero-arrow{color:var(--dim); font-family:'IBM Plex Mono', monospace; font-size:12px;}

  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  input[type=text], select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:14.5px;
    font-family:inherit;
    margin-bottom:16px;
  }
  input[type=text]:focus, select:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--primary);
    color:#0A0F1C;
    border:none;
    padding:12px 22px;
    font-size:14.5px;
    font-weight:700;
    border-radius:var(--radius-sm);
    cursor:pointer;
    font-family:inherit;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--primary); color:var(--primary);}
  .btnrow{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
  .btnrow .spacer{flex:1;}

  /* ---------- Questions ---------- */
  .qcount{font-size:12.5px; color:var(--dim); font-family:'IBM Plex Mono', monospace; margin-bottom:10px;}
  .qtext{font-size:16px; color:var(--text); margin-bottom:16px; font-weight:600;}
  .choice{
    display:flex; align-items:flex-start; gap:11px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:9px;
    cursor:pointer;
    background:var(--panel-2);
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover{border-color:var(--primary);}
  .choice.selected{border-color:var(--primary); background:var(--primary-bg);}
  .choice .radio{
    width:17px; height:17px; border-radius:50%;
    border:1.5px solid var(--dim); flex:0 0 auto; margin-top:2px;
    position:relative;
  }
  .choice.selected .radio{border-color:var(--primary);}
  .choice.selected .radio::after{
    content:''; position:absolute; inset:3px; border-radius:50%; background:var(--primary);
  }
  .choice .ctext{font-size:14.5px; color:var(--text);}

  /* ---------- Chart wrap ---------- */
  .chartwrap{
    background:var(--panel-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:16px 12px 8px;
    margin:14px 0 18px;
    height:260px;
  }
  .lesson-box{
    background:var(--panel-2);
    border-left:2.5px solid var(--primary);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:14px 16px;
    margin-bottom:16px;
    font-size:14px;
    color:var(--text);
  }

  /* ---------- Status pills ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:100px;
  }
  .pill.ok{color:var(--verify); background:var(--verify-bg);}
  .pill.bad{color:var(--mismatch); background:var(--mismatch-bg);}
  .pill.warn{color:var(--alert); background:var(--alert-bg);}

  /* ---------- Apply controls ---------- */
  .slider-row{margin-bottom:16px;}
  .slider-row .sr-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .slider-row .sr-top .sname{color:var(--text); font-weight:500;}
  .slider-row .sr-top .sval{color:var(--primary); font-family:'IBM Plex Mono', monospace; font-weight:600;}
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none;
    height:5px; border-radius:4px; background:var(--border);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:17px; height:17px; border-radius:50%;
    background:var(--primary); cursor:pointer; border:2px solid #0A0F1C;
  }
  input[type=range]::-moz-range-thumb{
    width:17px; height:17px; border-radius:50%;
    background:var(--primary); cursor:pointer; border:2px solid #0A0F1C;
  }
  .accuracy-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:12px 16px; margin:14px 0;
  }
  .accuracy-banner .acc-label{font-size:13px; color:var(--muted);}
  .accuracy-banner .acc-value{font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:700;}
  .acc-value.full{color:var(--verify);}
  .acc-value.partial{color:var(--alert);}
  .acc-value.low{color:var(--mismatch);}

  table.blocktbl{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px;}
  table.blocktbl th, table.blocktbl td{
    border:1px solid var(--border-soft); padding:8px 10px; text-align:left;
  }
  table.blocktbl th{color:var(--muted); font-weight:600; background:var(--panel-2); font-size:12px;}
  table.blocktbl td{color:var(--text); font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  .num-input{
    width:90px; background:var(--panel); border:1px solid var(--primary);
    color:var(--primary); font-family:'IBM Plex Mono', monospace; font-weight:700;
    border-radius:6px; padding:6px 8px; font-size:13px;
  }

  textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:12px 13px;
    font-family:inherit; font-size:14px; min-height:88px; resize:vertical;
    margin-bottom:16px;
  }
  textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}

  .likert-row{margin-bottom:20px;}
  .likert-q{font-size:14.5px; color:var(--text); margin-bottom:10px; font-weight:500;}
  .likert-opts{display:flex; gap:8px; flex-wrap:wrap;}
  .likert-opt{
    flex:1 1 100px; text-align:center; border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 6px; cursor:pointer;
    font-size:12.5px; color:var(--muted); background:var(--panel-2);
  }
  .likert-opt.selected{border-color:var(--primary); color:var(--primary); background:var(--primary-bg); font-weight:600;}

  /* ---------- Report ---------- */
  .score-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px;}
  .score-card{
    background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:16px;
  }
  .score-card .sc-name{font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'IBM Plex Mono', monospace;}
  .score-card .sc-val{font-size:26px; font-weight:700; font-family:'IBM Plex Mono', monospace;}
  .level-banner{
    text-align:center; padding:26px 16px; border-radius:var(--radius);
    margin-bottom:18px; border:1px solid var(--border);
  }
  .level-banner .lv-num{font-size:44px; font-weight:700; font-family:'IBM Plex Mono', monospace; line-height:1;}
  .level-banner .lv-name{font-size:15px; margin-top:6px; color:var(--muted);}
  .hist-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  .hist-table th, .hist-table td{border:1px solid var(--border-soft); padding:7px 8px; text-align:left;}
  .hist-table th{background:var(--panel-2); color:var(--muted); font-weight:600;}
  .hist-table td{color:var(--muted);}
  .save-status{font-size:12.5px; margin-top:10px; color:var(--dim); font-family:'IBM Plex Mono', monospace;}


  /* ---------- Drag-and-drop builder ---------- */
  .drag-stage{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px;}
  .drag-palette, .drag-script{
    background:var(--panel-2); border:1px dashed var(--border);
    border-radius:var(--radius-sm); padding:12px; min-height:120px;
  }
  .drag-col-label{font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .drag-block{
    border-radius:6px; padding:9px 11px; margin-bottom:8px; cursor:grab;
    font-size:13px; line-height:1.45; color:#0A0F1C; font-weight:500;
    border:1px solid rgba(0,0,0,0.18); user-select:none;
    touch-action:none; -webkit-user-select:none;
  }
  .drag-block:active{cursor:grabbing;}
  .drag-ghost{
    position:fixed; z-index:9999; pointer-events:none; opacity:.9;
    box-shadow:0 8px 24px rgba(0,0,0,0.45); margin:0;
  }
  .drag-palette.over{border-color:var(--primary); background:var(--primary-bg);}
  .drag-block.dragging{opacity:.45;}
  .drag-block.in-slot{margin-bottom:0;}
  .shape-hat{background:#F5A93B; border-top-left-radius:16px; border-top-right-radius:16px;}
  .shape-ctrl{background:#F0A23C; background:#E8A33E;}
  .shape-cmd{background:#6C8CFF;}
  .shape-start, .shape-end{background:#2FD98A; border-radius:100px;}
  .shape-process{background:#6C8CFF;}
  .shape-decision{background:#F5A93B; border-radius:4px;
    clip-path:polygon(4% 50%, 12% 0%, 88% 0%, 96% 50%, 88% 100%, 12% 100%);
    padding:9px 26px; text-align:center;}
  .drag-slot{
    display:flex; align-items:center; gap:9px;
    border:1px dashed var(--border-soft); border-radius:6px;
    padding:7px 9px; background:rgba(255,255,255,0.015); min-height:44px;
  }
  .drag-slot.filled{border-style:solid; border-color:var(--border); background:transparent;}
  .drag-slot.over{border-color:var(--primary); background:var(--primary-bg);}
  .drag-slot .slot-num{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim);
    flex:0 0 auto; width:16px; text-align:center;
  }
  .drag-slot .slot-inner{flex:1 1 auto; min-width:0;}
  .drag-slot .slot-hint{font-size:12px; color:var(--dim);}
  .drag-arrow{text-align:center; color:var(--dim); font-size:13px; line-height:1; margin:3px 0;}
  .drag-status{font-size:12.5px; color:var(--muted); margin-top:12px; font-family:'IBM Plex Mono', monospace;}
  .drag-empty-note{font-size:12px; color:var(--dim); line-height:1.5;}

  @media (max-width:640px){
    .drag-stage{grid-template-columns:1fr;}
  }

  @media (max-width:560px){
    .chain-node .lbl{display:none;}
    .score-grid{grid-template-columns:1fr;}
    .idbar{flex-direction:column; align-items:flex-start; gap:6px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="idbar" id="idbar">
    <div><span class="who" id="idbar-name"></span> · <span class="grade" id="idbar-grade"></span></div>
    <div class="badge mono" id="idbar-stage">SHOW</div>
  </div>
  <div class="chainbar" id="chainbar"></div>
  <div id="screen"></div>
</div>
<script>
/* =========================================================
   BlockGuard — PISA 2025 LDW practice test
   ========================================================= */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwj6yK7LCtTc_90VHpl2GndYSnYGgUA-B94dksZIxwk_Q9ZVcNx8cnEL2yJ8k3QvBjs/exec";

const GRADES = ["มัธยมศึกษาปีที่ 2","มัธยมศึกษาปีที่ 3","มัธยมศึกษาปีที่ 4","ปวช."];

/* ---------- SHOW: 5 items, 4 choices ---------- */
const SHOW_Q = [
  {
    q: "ระบบบล็อกเชนจำลองในสถานการณ์นี้ เก็บข้อมูลธุรกรรมอย่างไร",
    choices: [
      "เก็บเป็นบล็อกอิสระที่ไม่เกี่ยวข้องกัน",
      "เก็บเป็นบล็อกที่เชื่อมโยงต่อกันเป็นสายโซ่ตามลำดับ",
      "เก็บเป็นไฟล์เดียวรวมทุกธุรกรรม",
      "เก็บเฉพาะธุรกรรมล่าสุดเพียงบล็อกเดียว"
    ], correct: 1
  },
  {
    q: "Hash ในระบบจำลองนี้มีหน้าที่หลักอย่างไร",
    choices: [
      "เข้ารหัสข้อมูลเพื่อไม่ให้ผู้อื่นอ่านได้",
      "เป็นค่าที่ใช้ยืนยันว่าเนื้อหาของบล็อกไม่ถูกเปลี่ยนแปลง",
      "บอกจำนวนเงินในธุรกรรม",
      "กำหนดลำดับเวลาที่บล็อกถูกสร้าง"
    ], correct: 1
  },
  {
    q: "\"ข้อมูลไม่สอดคล้อง\" ตามนิยามที่กำหนด หมายถึงข้อใด",
    choices: [
      "Hash ของบล็อกก่อนหน้า ตรงกับ Previous Hash ของบล็อกปัจจุบัน",
      "Transaction Data ของสองบล็อกเหมือนกัน",
      "Hash ของบล็อกก่อนหน้า ไม่ตรงกับ Previous Hash ของบล็อกปัจจุบัน",
      "บล็อกปัจจุบันไม่มี Block ID"
    ], correct: 2
  },
  {
    q: "จากตาราง: B1 (Previous Hash —, Current Hash H100), B2 (Previous Hash H100, Current Hash H200), B3 (Previous Hash H999, Current Hash H300) — บล็อกใดคือ \"บล็อกที่ต้องตรวจสอบ\"",
    choices: ["B1","B2","B3","ไม่มีบล็อกใดต้องตรวจสอบ"], correct: 2
  },
  {
    q: "BlockBot ทำงานตามลำดับขั้นตอนใดจึงจะถูกต้อง",
    choices: [
      "คำนวณ Hash → อ่านข้อมูล Block → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล",
      "อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง → รายงานผล",
      "อ่านข้อมูล Block → ตรวจความถูกต้อง → คำนวณ Hash → เปรียบเทียบ Hash → ตรวจ Previous Hash → รายงานผล",
      "รายงานผล → อ่านข้อมูล Block → คำนวณ Hash → ตรวจ Previous Hash → เปรียบเทียบ Hash → ตรวจความถูกต้อง"
    ], correct: 1
  }
];

  applyIdx:0,
  applyParams: APPLY_ACTIVITIES.map(a=>{
    if(a.kind==="weights") return {w:[...a.defaultWeights]};
    if(a.kind==="dualThreshold") return {lo:a.defaultLo, hi:a.defaultHi};
    if(a.kind==="chainRepair"){
      const vals={};
      a.blocks.forEach(b=>{ if(b.editable) vals[b.id]=b.prev; });
      return {vals};
    }
    if(a.kind==="singleThreshold") return {t:a.defaultThreshold};
    if(a.kind==="ifThenPayout") return {d:a.defaultD, a:a.defaultA};
    return {};
  }),
  applyAccuracy: Array(APPLY_ACTIVITIES.length).fill(0),
  reflectLikert: Array(LIKERT_ITEMS.length).fill(null),
  reflectOpen: Array(OPEN_ITEMS.length).fill(""),
  submitted:false,
  posted:false,
  chartInstances:[]
}; }

/* Restart the whole test. Name and grade are kept (and stay editable on the
   intro screen) so the same student can try again quickly. */
function restartTest(){
  const keepName = state.name, keepGrade = state.grade;
  destroyCharts();
  Object.assign(state, freshState(), {name:keepName, grade:keepGrade});
  go("intro");
}

const STAGES = ["show","learn","apply","reflect"];
const STAGE_LABELS = {show:"SHOW", learn:"LEARN", apply:"APPLY", reflect:"REFLECT"};
const HASH_HINTS = ["0xF3A2","0x9C10","0x77B4"];

function destroyCharts(){
  state.chartInstances.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  state.chartInstances = [];
}

/* Draws into `canvasHolderDiv` using `drawFn(canvas)` (which must return a Chart
   instance). If Chart.js isn't available yet, shows a small retry notice instead
   of leaving a blank box or throwing and breaking the rest of the screen. */
function safeChart(canvasHolderDiv, drawFn){
  if(typeof Chart !== "undefined"){
    try{
      const canvas = document.createElement("canvas");
      canvasHolderDiv.innerHTML = "";
      canvasHolderDiv.appendChild(canvas);
      const chart = drawFn(canvas);
      state.chartInstances.push(chart);
      return chart;
    }catch(err){
      console.error("Chart render error:", err);
    }
  }
  canvasHolderDiv.innerHTML = "";
  const notice = el("div", null);
  notice.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:#8C9AC0;font-size:13px;text-align:center;padding:0 12px;";
  notice.innerHTML = "ไม่สามารถโหลดกราฟได้ในขณะนี้ (เครือข่ายอาจปิดกั้นการโหลดไลบรารีกราฟ) คำถามและกิจกรรมอื่น ๆ ยังทำต่อได้ตามปกติ";
  const retryBtn = el("button","btn secondary","ลองโหลดกราฟอีกครั้ง");
  retryBtn.style.cssText = "padding:8px 14px;font-size:12.5px;";
  retryBtn.addEventListener("click", ()=>{ render(); });
  notice.appendChild(retryBtn);
  canvasHolderDiv.appendChild(notice);
  return null;
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------- Chain progress + identity bar ---------- */
function renderChrome(){
  const idbar = document.getElementById("idbar");
  const chainbar = document.getElementById("chainbar");
  if(state.stage === "intro"){
    idbar.classList.remove("show");
    chainbar.classList.remove("show");
    return;
  }
  idbar.classList.add("show");
  document.getElementById("idbar-name").textContent = state.name;
  document.getElementById("idbar-grade").textContent = state.grade;
  document.getElementById("idbar-stage").textContent = state.stage === "report" ? "รายงานผล" : STAGE_LABELS[state.stage];

  chainbar.classList.add("show");
  chainbar.innerHTML = "";
  STAGES.forEach((s, i) => {
    const idx = STAGES.indexOf(state.stage);
    const node = el("div", "chain-node" + (state.stage===s ? " active" : "") + (state.stage!=="report" && idx>i ? " done" : "") + (state.stage==="report" ? " done" : ""));
    node.appendChild(el("div","dot","B"+(i+1)));
    node.appendChild(el("div","lbl",STAGE_LABELS[s]));
    chainbar.appendChild(node);
    if(i < STAGES.length-1){
      const link = el("div","chain-link");
      link.appendChild(el("span","hx",HASH_HINTS[i]));
      chainbar.appendChild(link);
    }
  });
}

function go(stage){
  state.stage = stage;
  window.scrollTo({top:0, behavior:"smooth"});
  render();
}

/* ---------- Drag-and-drop builder (Scratch-style blocks / flowchart) ---------- */
function renderDragBuilder(container, task, ti){
  const d = task.drag;
  const placed = state.learnDrag[ti];

  const card = el("div","card");
  card.innerHTML = `<h3>${d.title}</h3><p style="font-size:13.5px;">${d.prompt}</p>`;

  const stage = el("div","drag-stage");
  const palette = el("div","drag-palette");
  palette.appendChild(el("div","drag-col-label","กล่องบล็อกคำสั่ง"));
  const script = el("div","drag-script");
  script.appendChild(el("div","drag-col-label", d.mode==="flowchart" ? "ผังงานของคุณ" : "สคริปต์ของคุณ"));

  /* Pointer-based drag: works with mouse AND touch (HTML5 drag-and-drop has no
     touch support, so tablets would otherwise be stuck with tap-only). A short
     press without movement is treated as a tap. */
  let drag = null;

  function placeBlock(id, fromSlot, toSlot){
    if(fromSlot !== null && fromSlot !== undefined) placed[fromSlot] = null;
    if(toSlot !== null && toSlot !== undefined){
      const displaced = placed[toSlot];
      placed[toSlot] = id;
      if(displaced && displaced !== id){
        const empty = placed.indexOf(null);
        if(empty !== -1) placed[empty] = displaced;
      }
    }
    render();
  }

  function clearHighlights(){
    script.querySelectorAll(".drag-slot.over").forEach(e=>e.classList.remove("over"));
    palette.classList.remove("over");
  }

  function targetUnder(x, y){
    const el2 = document.elementFromPoint(x, y);
    if(!el2) return null;
    const slot = el2.closest(".drag-slot");
    if(slot && script.contains(slot)) return {type:"slot", el:slot, index:Number(slot.dataset.slotIndex)};
    if(el2.closest(".drag-palette")) return {type:"palette"};
    return null;
  }

  function onPointerMove(ev){
    if(!drag) return;
    const dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if(!drag.active && Math.hypot(dx, dy) < 6) return;
    if(!drag.active){
      drag.active = true;
      const r = drag.el.getBoundingClientRect();
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add("drag-ghost");
      drag.ghost.style.width = r.width + "px";
      drag.ghost.style.marginLeft = "0";
      document.body.appendChild(drag.ghost);
      drag.offX = drag.startX - r.left;
      drag.offY = drag.startY - r.top;
      drag.el.classList.add("dragging");
    }
    ev.preventDefault();
    drag.ghost.style.left = (ev.clientX - drag.offX) + "px";
    drag.ghost.style.top  = (ev.clientY - drag.offY) + "px";
    clearHighlights();
    const t = targetUnder(ev.clientX, ev.clientY);
    if(t && t.type === "slot") t.el.classList.add("over");
    else if(t && t.type === "palette") palette.classList.add("over");

    // auto-scroll when dragging near the top/bottom edge, so slots that are
    // off-screen (common on phones and tablets) can still be reached
    const edge = 70;
    if(ev.clientY < edge) window.scrollBy(0, -Math.ceil((edge - ev.clientY) / 4));
    else if(ev.clientY > window.innerHeight - edge) window.scrollBy(0, Math.ceil((ev.clientY - (window.innerHeight - edge)) / 4));
  }

  function onPointerUp(ev){
    if(!drag) return;
    const d = drag; drag = null;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerUp);
    if(d.ghost) d.ghost.remove();
    d.el.classList.remove("dragging");
    clearHighlights();

    if(!d.active){
      // treated as a tap
      if(d.from === null){
        const empty = placed.indexOf(null);
        if(empty !== -1) placeBlock(d.id, null, empty);
      } else {
        placed[d.from] = null;
        render();
      }
      return;
    }
    const t = targetUnder(ev.clientX, ev.clientY);
    if(t && t.type === "slot") placeBlock(d.id, d.from, t.index);
    else if(t && t.type === "palette" && d.from !== null) placeBlock(d.id, d.from, null);
  }

  function blockEl(b, opts){
    const e = el("div","drag-block shape-"+b.shape+(opts && opts.inSlot ? " in-slot":""));
    e.style.marginLeft = (b.indent||0) * 18 + "px";
    e.innerHTML = `<span class="db-text">${b.text}</span>`;
    e.addEventListener("pointerdown", (ev)=>{
      if(ev.button !== undefined && ev.button !== 0) return;
      drag = {
        id: b.id,
        from: (opts && opts.inSlot) ? opts.slotIndex : null,
        el: e, startX: ev.clientX, startY: ev.clientY, active:false, ghost:null
      };
      window.addEventListener("pointermove", onPointerMove, {passive:false});
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
    });
    return e;
  }

  // palette: blocks not yet placed  // palette: blocks not yet placed
  const unused = d.blocks.filter(b=> placed.indexOf(b.id) === -1);
  if(unused.length === 0){
    const empty = el("div","drag-empty-note","วางบล็อกครบทุกช่องแล้ว — แตะบล็อกในสคริปต์เพื่อนำกลับมาแก้ไขได้");
    palette.appendChild(empty);
  }
  unused.forEach(b=>{ palette.appendChild(blockEl(b, {inSlot:false})); });

  // script: numbered slots
  for(let i=0;i<d.slots;i++){
    const slot = el("div","drag-slot" + (placed[i] ? " filled":""));
    slot.dataset.slotIndex = String(i);
    slot.appendChild(el("span","slot-num", String(i+1)));
    const inner = el("div","slot-inner");
    if(placed[i]){
      const b = d.blocks.find(x=>x.id===placed[i]);
      inner.appendChild(blockEl(b, {inSlot:true, slotIndex:i}));
    } else {
      inner.appendChild(el("span","slot-hint", d.mode==="flowchart" ? "วางสัญลักษณ์ผังงานที่นี่" : "วางบล็อกคำสั่งที่นี่"));
    }
    slot.appendChild(inner);
    script.appendChild(slot);
    if(i < d.slots-1) script.appendChild(el("div","drag-arrow","↓"));
  }

  stage.appendChild(palette);
  stage.appendChild(script);
  card.appendChild(stage);

  const filled = placed.filter(v=>v!==null).length;
  const status = el("div","drag-status", `วางแล้ว ${filled} / ${d.slots} ช่อง`);
  card.appendChild(status);

  const resetBtn = el("button","btn secondary","ล้างและเริ่มใหม่");
  resetBtn.style.cssText = "margin-top:10px;padding:8px 14px;font-size:12.5px;";
  resetBtn.addEventListener("click", ()=>{
    for(let i=0;i<d.slots;i++) placed[i]=null;
    render();
  });
  card.appendChild(resetBtn);

  container.appendChild(card);
}

/* =========================================================
   APPLY — compute helpers
   ========================================================= */
function labelThai(l){
  return {low:"ต่ำ", med:"ปานกลาง", high:"สูง", normal:"ปกติ", tampered:"ผิดปกติ", pay:"จ่ายชดเชย", nopay:"ไม่จ่าย"}[l] || l;
}
function labelColor(l){
  return {low:"#2FD98A", med:"#F5A93B", high:"#E4576B", normal:"#2FD98A", tampered:"#E4576B", pay:"#2FD98A", nopay:"#8C9AC0"}[l] || "#6C8CFF";
}

function classifyThree(score, low, high){
  if(score < low) return "low";
  if(score <= high) return "med";
  return "high";
}
function classifyBinary(score, t){
  return score < t ? "tampered" : "normal";
}

function computeActivityResult(activity, params){
  if(activity.kind === "weights"){
    const sw = params.w.reduce((a,b)=>a+b,0);
    const results = activity.blocks.map(b=>{
      const score = sw===0 ? 0 : b.f.reduce((acc,fi,idx)=>acc+fi*params.w[idx],0)/sw;
      const computed = classifyThree(score, activity.thresholds.low, activity.thresholds.high);
      return {id:b.id, score, computed, truth:b.label, correct: computed===b.label};
    });
    return results;
  }
  if(activity.kind === "dualThreshold"){
    return activity.blocks.map(b=>{
      const computed = classifyThree(b.score, params.lo, params.hi);
      return {id:b.id, score:b.score, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "singleThreshold"){
    return activity.blocks.map(b=>{
      const computed = classifyBinary(b.score, params.t);
      return {id:b.id, score:b.score, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "ifThenPayout"){
    return activity.blocks.map(b=>{
      const computed = (b.delay >= params.d && b.agree >= params.a) ? "pay" : "nopay";
      return {id:b.id, score:b.delay, computed, truth:b.label, correct: computed===b.label};
    });
  }
  if(activity.kind === "chainRepair"){
    return activity.blocks.map((b,idx)=>{
      if(b.prev===null || idx===0){
        return {id:b.id, correct:true, status:"ถูกต้อง (บล็อกเริ่มต้น)"};
      }
      const effectivePrev = b.editable ? Number(params.vals[b.id]) : b.prev;
      const priorCur = activity.blocks[idx-1].cur;
      const match = effectivePrev === priorCur;
      return {id:b.id, correct:match, status: match?"ถูกต้อง":"ไม่ถูกต้อง", effectivePrev, priorCur};
    });
  }
  return [];
}

function accuracyOf(results){
  if(results.length===0) return 0;
  const correct = results.filter(r=>r.correct).length;
  return Math.round((correct/results.length)*100);
}

function accuracyClass(pct){
  if(pct===100) return "full";
  if(pct>=70) return "partial";
  return "low";
}

function renderAccuracyBanner(parent, pct){
  const banner = el("div","accuracy-banner");
  banner.innerHTML = `<div class="acc-label">ความแม่นยำเทียบกับผลจริง</div><div class="acc-value ${accuracyClass(pct)}">${pct}%</div>`;
  parent.appendChild(banner);
  return banner;
}

function makeResultChart(chartDiv, results, isThree){
  return safeChart(chartDiv, (canvas)=> new Chart(canvas.getContext("2d"), {
    type:"bar",
    data:{
      labels: results.map(r=>r.id),
      datasets:[{
        label:"ผลจำแนกปัจจุบัน",
        data: results.map(r=> isThree ? (r.computed==="low"?1:r.computed==="med"?2:3) : (r.computed==="normal"?1:2) ),
        backgroundColor: results.map(r=> r.correct ? "#2FD98A" : "#E4576B")
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:(ctx)=>{
          const r = results[ctx.dataIndex];
          return "จำแนกเป็น: "+labelThai(r.computed)+" (จริง: "+labelThai(r.truth)+")";
        }}}
      },
      scales:{
        x:{ ticks:{color:"#8C9AC0", font:{size:10}}, grid:{display:false} },
        y:{ display:false }
      }
    }
  }));
}

    currentResults = computeActivityResult(activity, params);
    let html = `<tr><th>Block</th><th>Transaction Data</th><th>Previous Hash</th><th>Current Hash</th><th>สถานะ</th></tr>`;
    activity.blocks.forEach((b,idx)=>{
      const r = currentResults[idx];
      const prevCell = b.editable
        ? `<input type="number" class="num-input" id="previn-${b.id}" value="${params.vals[b.id]}">`
        : (b.prev===null ? "—" : "H"+b.prev);
      const statusPill = idx===0
        ? `<span class="pill ok">Genesis</span>`
        : (r.correct ? `<span class="pill ok">ถูกต้อง</span>` : `<span class="pill bad">ไม่ถูกต้อง</span>`);
      html += `<tr><td>${b.id}</td><td class="mono" style="font-family:inherit;">${b.data}</td><td>${prevCell}</td><td>H${b.cur}</td><td>${statusPill}</td></tr>`;
    });
    table.innerHTML = html;
    activity.blocks.forEach(b=>{
      if(b.editable){
        const input = document.getElementById("previn-"+b.id);
        input.addEventListener("input", (e)=>{
          params.vals[b.id] = e.target.value === "" ? NaN : Number(e.target.value);
          refreshChart();
        });
      }
    });
  }
  function refreshChart(){
    currentResults = computeActivityResult(activity, params);
    // resync table status pills without full rebuild of inputs (avoid losing focus)
    activity.blocks.forEach((b,idx)=>{
      if(idx===0) return;
      const r = currentResults[idx];
      const cell = table.rows[idx+1].cells[4];
      cell.innerHTML = r.correct ? `<span class="pill ok">ถูกต้อง</span>` : `<span class="pill bad">ไม่ถูกต้อง</span>`;
    });
    safeChart(chartDiv, (canvas)=> new Chart(canvas.getContext("2d"), {
      type:"bar",
      data:{
        labels: activity.blocks.map(b=>b.id),
        datasets:[{ label:"สถานะสายโซ่ (1=ถูกต้อง, 0=ไม่ถูกต้อง)",
          data: currentResults.map(r=> r.correct?1:0),
          backgroundColor: currentResults.map(r=> r.correct? "#2FD98A":"#E4576B") }]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{ x:{ticks:{color:"#8C9AC0"}, grid:{display:false}}, y:{min:0,max:1, ticks:{color:"#8C9AC0", stepSize:1}} } }
    }));
    bannerHolder.innerHTML = "";
    renderAccuracyBanner(bannerHolder, accuracyOf(currentResults));
  }
  refreshTable();
  refreshChart();

  applyNavRow(card, aidx, {get length(){return currentResults.length;}, filter:(fn)=>currentResults.filter(fn)});
}

  const params = state.applyParams[aidx];
  const row = el("div","slider-row");
  row.innerHTML = `<div class="sr-top"><span class="sname">เกณฑ์ตัดสิน (${labelThai(activity.labelBelow)} ต่ำกว่า / ${labelThai(activity.labelAbove)} เท่ากับหรือสูงกว่า)</span><span class="sval" id="tval">${params.t}</span></div>`;
  const input = document.createElement("input"); input.type="range"; input.min="0"; input.max="100"; input.step="1"; input.value=params.t;

function renderApplyIfThenPayout(container, activity, aidx){
  const card = el("div","card");
  card.innerHTML = `<div class="eyebrow-tag">APPLY · กิจกรรมที่ ${aidx+1}/${APPLY_ACTIVITIES.length}</div><h2>${activity.title}</h2><p>${activity.intro}</p>
    <div class="lesson-box mono" id="if-then-rule"></div>`;

  const params = state.applyParams[aidx];
  function slider(name, id, min, max, step, val, onInput){
    const row = el("div","slider-row");
    row.innerHTML = `<div class="sr-top"><span class="sname">${name}</span><span class="sval" id="${id}">${val}</span></div>`;
    const inp = document.createElement("input");
    inp.type="range"; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    inp.addEventListener("input", e=>onInput(Number(e.target.value)));
    row.appendChild(inp);
    card.appendChild(row);
  }
  slider("D · เกณฑ์ความล่าช้าขั้นต่ำ (นาที)", "d-val", 0, 240, 5, params.d, v=>{ params.d=v; refresh(); });
  slider("A · เกณฑ์ข้อมูลตรงกันระหว่างแหล่งข้อมูล (%)", "a-val", 0, 100, 5, params.a, v=>{ params.a=v; refresh(); });

  const tableHolder = el("div", null);
  card.appendChild(tableHolder);
  const chartDiv = el("div","chartwrap");
  card.appendChild(chartDiv);
  const bannerHolder = el("div", null);
  card.appendChild(bannerHolder);
  const payoutNote = el("p", null);
  payoutNote.style.fontSize = "13px";
  card.appendChild(payoutNote);
  container.appendChild(card);

  let currentResults;
  function refresh(){
    document.getElementById("d-val").textContent = params.d;
    document.getElementById("a-val").textContent = params.a;
    document.getElementById("if-then-rule").innerHTML =
      `IF (ล่าช้า ≥ ${params.d} นาที AND ข้อมูลตรงกัน ≥ ${params.a}%) THEN จ่ายชดเชย ${activity.payout.toLocaleString()} บาท เข้ากระเป๋าดิจิทัลทันที`;
    currentResults = computeActivityResult(activity, params);

    let html = `<table class="blocktbl"><tr><th>เที่ยวบิน</th><th>ล่าช้า (นาที)</th><th>ข้อมูลตรงกัน (%)</th><th>การตัดสินใจของสัญญา</th></tr>`;
    activity.blocks.forEach((b,i)=>{
      const r = currentResults[i];
      html += `<tr><td>${b.id}</td><td>${b.delay}</td><td>${b.agree}</td><td>${r.computed==="pay" ? '<span class="pill ok">จ่ายชดเชยอัตโนมัติ</span>' : '<span class="pill warn">ไม่จ่าย</span>'}</td></tr>`;
    });
    html += `</table>`;
    tableHolder.innerHTML = html;

    safeChart(chartDiv, (canvas)=> new Chart(canvas.getContext("2d"), {
      type:"bar",
      data:{ labels: currentResults.map(r=>r.id),
        datasets:[{ label:"ความล่าช้า (นาที)", data: currentResults.map(r=>r.score),
          backgroundColor: currentResults.map(r=> r.correct ? "#2FD98A" : "#E4576B") }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{ label:(ctx)=>{ const r=currentResults[ctx.dataIndex]; return "สัญญา: "+labelThai(r.computed)+" (ผลจริง: "+labelThai(r.truth)+")"; } } } },
        scales:{ x:{ticks:{color:"#8C9AC0", font:{size:10}}, grid:{display:false}}, y:{ticks:{color:"#8C9AC0"}, grid:{color:"rgba(255,255,255,0.06)"}} } }
    }));

    bannerHolder.innerHTML = "";
    renderAccuracyBanner(bannerHolder, accuracyOf(currentResults));
    const paid = currentResults.filter(r=>r.computed==="pay").length;
    payoutNote.textContent = `สัญญาจ่ายชดเชยอัตโนมัติ ${paid} รายการ รวม ${(paid*activity.payout).toLocaleString()} บาท (ไม่ต้องยื่นเรื่องเคลม)`;
  }
  refresh();

  applyNavRow(card, aidx, {get length(){return currentResults.length;}, filter:(fn)=>currentResults.filter(fn)});
}

function renderApply(container){
  const aidx = state.applyIdx;
  const activity = APPLY_ACTIVITIES[aidx];
  if(activity.kind==="weights") renderApplyWeights(container, activity, aidx);
  else if(activity.kind==="dualThreshold") renderApplyDualThreshold(container, activity, aidx);
  else if(activity.kind==="chainRepair") renderApplyChainRepair(container, activity, aidx);
  else if(activity.kind==="singleThreshold") renderApplySingleThreshold(container, activity, aidx);
  else if(activity.kind==="ifThenPayout") renderApplyIfThenPayout(container, activity, aidx);
}

/* ---------- Screen: REFLECT ---------- */
function renderReflect(container){
  const card = el("div","card");
  card.innerHTML = `<div class="eyebrow-tag">REFLECT · ประเมินตนเอง</div><h2>สะท้อนคิดเกี่ยวกับสิ่งที่เรียนรู้</h2><p>เลือกระดับความเห็นด้วยกับข้อความต่อไปนี้ และตอบคำถามปลายเปิดตามความคิดเห็นของนักเรียน</p>`;

  LIKERT_ITEMS.forEach((text, li)=>{
    const row = el("div","likert-row");
    row.appendChild(el("div","likert-q", (li+1)+". "+text));
    const opts = el("div","likert-opts");
    LIKERT_SCALE.forEach((label, oi)=>{
      const opt = el("div","likert-opt"+(state.reflectLikert[li]===oi?" selected":""), label);
      opt.addEventListener("click", ()=>{ state.reflectLikert[li]=oi; render(); });
      opts.appendChild(opt);
    });
    row.appendChild(opts);
    card.appendChild(row);
  });

  OPEN_ITEMS.forEach((q, oi)=>{
    const wrap = el("div", null);
    wrap.style.marginBottom = "16px";
    wrap.appendChild(el("div","likert-q", (LIKERT_ITEMS.length+oi+1)+". "+q));
    const ta = document.createElement("textarea");
    ta.placeholder = "พิมพ์คำตอบของนักเรียนที่นี่...";
    ta.value = state.reflectOpen[oi];
    ta.addEventListener("input", (e)=>{ state.reflectOpen[oi] = e.target.value; refreshSubmitState(); });
    wrap.appendChild(ta);
    card.appendChild(wrap);
  });

  const btnrow = el("div","btnrow");
  const back = el("button","btn secondary","← ก่อนหน้า");
  back.addEventListener("click", ()=>{ go("apply"); state.applyIdx = APPLY_ACTIVITIES.length-1; });
  const spacer = el("div","spacer");
  const submit = el("button","btn","ส่งแบบทดสอบและดูรายงานผล →");
  btnrow.appendChild(back); btnrow.appendChild(spacer); btnrow.appendChild(submit);
  card.appendChild(btnrow);
  container.appendChild(card);

  function refreshSubmitState(){
    const likertDone = state.reflectLikert.every(v=>v!==null);
    const openDone = state.reflectOpen.every(v=>v.trim().length>=10);
    submit.disabled = !(likertDone && openDone);
  }
  submit.addEventListener("click", ()=>{
    submitTest();
  });
  refreshSubmitState();
}

/* =========================================================
   Scoring
   ========================================================= */
function computeShowScore(){
  const correct = SHOW_Q.filter((q,i)=>state.showAns[i]===q.correct).length;
  return {correct, total:SHOW_Q.length, pct: Math.round(correct/SHOW_Q.length*100)};
}
function dragIsCorrect(ti){
  const t = LEARN_TASKS[ti];
  if(!t.drag) return false;
  const placed = state.learnDrag[ti];
  return t.drag.answer.every((id,i)=> placed[i]===id);
}
function computeLearnScore(){
  let correct=0, total=0;
  LEARN_TASKS.forEach((t,ti)=>{
    if(t.drag){
      total++;
      if(dragIsCorrect(ti)) correct++;
    }
    t.questions.forEach((q,qi)=>{
      total++;
      if(state.learnAns[ti][qi]===q.correct) correct++;
    });
  });
  return {correct, total, pct: Math.round(correct/total*100)};
}
function computeApplyScore(){
  const avg = state.applyAccuracy.reduce((a,b)=>a+b,0)/state.applyAccuracy.length;
  return {perActivity: [...state.applyAccuracy], pct: Math.round(avg)};
}
function computeReflectScore(){
  const likertPts = state.reflectLikert.filter(v=>v!==null).length * (40/LIKERT_ITEMS.length);
  const openPts = state.reflectOpen.filter(v=>v.trim().length>=10).length * (60/OPEN_ITEMS.length);
  return {pct: Math.round(likertPts+openPts)};
}
function computeOverall(show, learn, apply, reflect){
  return Math.round(show.pct*0.15 + learn.pct*0.35 + apply.pct*0.35 + reflect.pct*0.15);
}
function computeLevel(overall){
  if(overall>=85) return {num:4, name:"ระดับ 4 · Advanced (ขั้นสูง)"};
  if(overall>=70) return {num:3, name:"ระดับ 3 · Proficient (ชำนาญ)"};
  if(overall>=50) return {num:2, name:"ระดับ 2 · Basic (พื้นฐาน)"};
  return {num:1, name:"ระดับ 1 · Needs Improvement (ควรปรับปรุง)"};
}

/* =========================================================
   Submission
   ========================================================= */
function submitTest(){
  state.submitted = true;
  go("report");
}

function buildReportStrings(show, learn, apply, reflect, overall, level){
  return {
    showReport: `SHOW: ตอบถูก ${show.correct}/${show.total} ข้อ (${show.pct}%)`,
    learnReport: `LEARN: ตอบถูก ${learn.correct}/${learn.total} ข้อ (${learn.pct}%)`,
    applyReport: `APPLY: ความแม่นยำเฉลี่ย ${apply.pct}% (กิจกรรม 1-${apply.perActivity.length}: ${apply.perActivity.join(", ")}%)`,
    reflectReport: `REFLECT: ระดับความสมบูรณ์ของการประเมินตนเอง ${reflect.pct}%`,
    overallReport: `คะแนนรวม ${overall}%`,
    qualityReport: level.name
  };
}

async function postResult(payload){
  try{
    const res = await fetch(WEBAPP_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    return {ok:true, text: await res.text()};
  }catch(err){
    return {ok:false, error: String(err)};
  }
}

async function fetchHistory(name){
  try{
    const res = await fetch(WEBAPP_URL + "?action=history&name=" + encodeURIComponent(name));
    const data = await res.json();
    return {ok:true, rows: Array.isArray(data) ? data : (data.rows || [])};
  }catch(err){
    return {ok:false, error:String(err)};
  }
}

/* ---------- Screen: REPORT ---------- */
function renderReport(container){
  const show = computeShowScore();
  const learn = computeLearnScore();
  const apply = computeApplyScore();
  const reflect = computeReflectScore();
  const overall = computeOverall(show, learn, apply, reflect);
  const level = computeLevel(overall);
  const strings = buildReportStrings(show, learn, apply, reflect, overall, level);

  const levelColor = {4:"#2FD98A", 3:"#6C8CFF", 2:"#F5A93B", 1:"#E4576B"}[level.num];

  const banner = el("div","level-banner");
  banner.style.borderColor = levelColor;
  banner.innerHTML = `<div class="lv-num" style="color:${levelColor}">${level.num}</div><div class="lv-name">${level.name}</div><div style="margin-top:10px; color:#8C9AC0; font-size:14px;">คะแนนรวม ${overall}%</div>`;
  container.appendChild(banner);

  const card = el("div","card");
  card.innerHTML = `<div class="eyebrow-tag">รายงานผลการทำแบบทดสอบ</div><h2>สรุปผล 4 ด้าน — ${state.name} (${state.grade})</h2>`;
  const grid = el("div","score-grid");
  const items = [
    {name:"SHOW · แสดงสิ่งที่รู้", pct:show.pct, detail:show.correct+"/"+show.total+" ข้อ"},
    {name:"LEARN · เรียนรู้", pct:learn.pct, detail:learn.correct+"/"+learn.total+" ข้อ"},
    {name:"APPLY · ประยุกต์ใช้", pct:apply.pct, detail:"เฉลี่ย "+APPLY_ACTIVITIES.length+" กิจกรรม"},
    {name:"REFLECT · ประเมินตนเอง", pct:reflect.pct, detail:"ความสมบูรณ์"}
  ];
  items.forEach(it=>{
    const sc = el("div","score-card");
    sc.innerHTML = `<div class="sc-name">${it.name}</div><div class="sc-val" style="color:${it.pct>=70?'#2FD98A':it.pct>=50?'#F5A93B':'#E4576B'}">${it.pct}%</div><div style="font-size:12px;color:#5B6889;margin-top:4px;">${it.detail}</div>`;
    grid.appendChild(sc);
  });
  card.appendChild(grid);

  const chartDiv = el("div","chartwrap");
  card.appendChild(chartDiv);
  container.appendChild(card);

  safeChart(chartDiv, (canvas)=> new Chart(canvas.getContext("2d"), {
    type:"bar",
    data:{ labels: items.map(i=>i.name.split(" · ")[0]),
      datasets:[{ label:"คะแนน (%)", data: items.map(i=>i.pct),
        backgroundColor:["#6C8CFF","#6C8CFF","#6C8CFF","#6C8CFF"] }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ y:{min:0,max:100, ticks:{color:"#8C9AC0"}, grid:{color:"rgba(255,255,255,0.06)"}}, x:{ticks:{color:"#8C9AC0"}, grid:{display:false}} } }
  }));

  const applyDetail = el("div","card tight");
  applyDetail.innerHTML = `<h3>รายละเอียดความแม่นยำ APPLY แต่ละกิจกรรม</h3>` +
    APPLY_ACTIVITIES.map((a,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;"><span style="color:var(--muted);">${a.title}</span><span class="mono" style="color:${state.applyAccuracy[i]===100?'#2FD98A':'#F5A93B'};font-weight:600;">${state.applyAccuracy[i]}%</span></div>`).join("");
  container.appendChild(applyDetail);

  const histCard = el("div","card tight");
  histCard.innerHTML = `<h3>ประวัติการทำแบบทดสอบของ ${state.name}</h3><div id="hist-holder"><p style="font-size:13px;">กำลังโหลดประวัติ...</p></div><div class="save-status" id="save-status">กำลังบันทึกผลลง Google Sheet...</div>`;
  container.appendChild(histCard);

  const retryRow = el("div","btnrow");
  retryRow.style.justifyContent = "center";
  const retryBtn = el("button","btn","↻ ทำแบบทดสอบอีกครั้ง");
  retryBtn.addEventListener("click", restartTest);
  retryRow.appendChild(retryBtn);
  container.appendChild(retryRow);

  if(!state.posted){
    state.posted = true;
    const payload = {
      timestamp: new Date().toISOString(),
      name: state.name,
      grade: state.grade,
      showReport: strings.showReport,
      learnReport: strings.learnReport,
      applyReport: strings.applyReport,
      reflectReport: strings.reflectReport,
      overallReport: strings.overallReport,
      qualityReport: strings.qualityReport
    };
    postResult(payload).then(res=>{
      const statusEl = document.getElementById("save-status");
      if(statusEl) statusEl.textContent = res.ok ? "บันทึกผลเรียบร้อยแล้ว" : "ไม่สามารถบันทึกผลได้ในขณะนี้ (โปรดตรวจสอบการเชื่อมต่อเครือข่าย)";
    });
    fetchHistory(state.name).then(res=>{
      const holder = document.getElementById("hist-holder");
      if(!holder) return;
      if(!res.ok || !res.rows || res.rows.length===0){
        holder.innerHTML = `<p style="font-size:13px;">ยังไม่มีประวัติก่อนหน้าของนักเรียนคนนี้</p>`;
        return;
      }
      let html = `<table class="hist-table"><tr><th>เวลา</th><th>คะแนนรวม</th><th>ระดับ</th></tr>`;
      res.rows.forEach(r=>{
        html += `<tr><td>${r.timestamp||""}</td><td>${r.overallReport||""}</td><td>${r.qualityReport||""}</td></tr>`;
      });
      html += `</table>`;
      holder.innerHTML = html;
    });
  }
}

/* =========================================================
   Main render dispatcher
   ========================================================= */
function render(){
  destroyCharts();
  const container = document.getElementById("screen");
  container.innerHTML = "";
  renderChrome();
  if(state.stage==="intro") renderIntro(container);
  else if(state.stage==="show") renderShow(container);
  else if(state.stage==="learn") renderLearn(container);
  else if(state.stage==="apply") renderApply(container);
  else if(state.stage==="reflect") renderReflect(container);
  else if(state.stage==="report") renderReport(container);
}

render();
/* Once Chart.js finishes loading (or exhausts its fallback CDNs), re-render
   the current screen so any charts that showed the "couldn't load" notice
   get drawn properly, without disrupting whatever the person was doing. */
window.__chartJsLoad.then(()=>{ render(); });
</script>
